[Redis]
Host = redis-master
Port = 6379
Password = 123456
SentinelHost = sentinel-1,sentinel-2,sentinel-3
SentinelPort = 26379,26379,26379
; Slave 端口（可选，逗号分隔。配置后纯读操作随机走 Slave）
[Mysql]
Host = mysql-master
Port = 3306
User = root
Password = 123456
Schema = JerryChat
; Slave 端口（可选，配置后纯读操作走 Slave）
SlaveHost = mysql-slave
SlavePort = 3306
[StatusServer]
Host = statusserver
Port = 50052
TCP_port = 10000
[ChatServers]
List = ChatServer1,ChatServer2
[SelfServer]
Host = 0.0.0.0
Port = 8090
RPCPort = 50053
Name = ChatServer1
[ChatServer2]
Host = chatserver2
Port = 8091
Name = ChatServer2
RPCPort = 50054
[PeerServers]
Servers = ChatServer2
[ResourceServer]
Name = ResourceServer
Host = resourceserver
Port  = 9090
RPCPort = 51055
[JWT]
Secret = im-jwt-secret-2026
[SSL]
Cert = /app/certs/server.crt
Key = /app/certs/server.key
CaCert = /app/certs/ca.crt
[Sensitive]
