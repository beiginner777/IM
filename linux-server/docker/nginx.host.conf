# IM 系统 Nginx —— 裸机部署（C++ 服务跑宿主机，Nginx 用 --network host）
# 127.0.0.1 即宿主机

limit_req_zone $binary_remote_addr zone=seckill:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

upstream authserver {
    server 127.0.0.1:8080;
}

upstream seckill_servers {
    least_conn;
    server 127.0.0.1:8101;
    keepalive 64;
}

server {
    listen 8100 ssl;

    # TLS 证书（自签，由 gen_certs.sh 生成，挂载自 ./certs）
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    limit_conn conn_per_ip 5;

    # 统一代理头：/fe_login、/loginAddr 依赖 X-Forwarded-For 做异地登录检测
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # AuthServer 路由
    location /getVerifyCode     { proxy_pass http://authserver; }
    location /registerUserAddr  { proxy_pass http://authserver; }
    location /loginAddr         { proxy_pass http://authserver; }
    location /fe_login          { proxy_pass http://authserver; }
    location /api/              { proxy_pass http://authserver; }   # 前端 /api/* 请求

    # SeckillServer 读接口（不限流）
    location /products  { proxy_pass http://seckill_servers; }
    location /rank      { proxy_pass http://seckill_servers; }
    location /profile   { proxy_pass http://seckill_servers; }
    location /balance   { proxy_pass http://seckill_servers; }
    location /orders    { proxy_pass http://seckill_servers; }
    location /order/    { proxy_pass http://seckill_servers; }

    # SeckillServer 写接口（限流）
    location /buy/      { limit_req zone=seckill burst=20 nodelay; proxy_pass http://seckill_servers; }
    location /recharge  { limit_req zone=seckill burst=20 nodelay; proxy_pass http://seckill_servers; }

    # SPA 前端（默认 → AuthServer 静态文件）
    location / {
        proxy_pass http://authserver;
    }
}
