
; 秒杀业务服务器自身信息（注册到 StatusServer 用，前端 setBaseURL 拿到的就是这个地址）
[SelfServer]
Name = SeckillServer1
Host = 0.0.0.0
Port = 8101
[StatusServer]
Host = statusserver
Port = 50052
TCP_port = 10000
; 以下为后续接入真实秒杀逻辑（Redis Lua 扣库存 / MySQL 订单）预留
[Redis]
Host = redis-master
Port = 6379
Password = 123456
SentinelHost = sentinel-1,sentinel-2,sentinel-3
SentinelPort = 26379,26379,26379
; Slave 端口（可选，配置后写操作走master,读操作走 Master/Slave）
[Mysql]
Host = mysql-master
Port = 3306
User = root
Password = 123456
Schema = JerryChat
; Slave 端口（可选，配置后写操作走master,读操作走 Master/Slave）
SlaveHost = mysql-slave
SlavePort = 3306
[JWT]
Secret = im-jwt-secret-2026
