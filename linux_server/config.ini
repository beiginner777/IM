; ==========================================
; 通用 config 模板 — WSL 连接 Windows Docker
; 放到 ~/im-build/server/bin/config.ini
;
; 各服务需修改的项:
;   AuthServer:     删 [SelfServer]
;   StatusServer:   [SelfServer] Name=StatusServer Port=50052
;   ChatServer1:    [SelfServer] Name=ChatServer1  Port=8090
;   ChatServer2:    [SelfServer] Name=ChatServer2  Port=8091
;   ResourceServer: [SelfServer] Name=ResourceServer Port=9090
;   SeckillServer:  [SelfServer] Name=SeckillServer1 Port=8101
; ==========================================

[SelfServer]
Name = ChatServer1
Host = 0.0.0.0
Port = 8090
; ResourceServer 还需要:
; UploadPath = ./uploads

[Redis]
Host = 127.0.0.1
Port = 6380
Password = 123456
SentinelHost = 10.255.255.254
SentinelPort = 26379,26380,26381
SlavePorts = 6381,6382

[Mysql]
Host = 127.0.0.1
Port = 3307
User = root
Password = 123456
Schema = JerryChat
SlaveHost = 127.0.0.1
SlavePort = 3308

[StatusServer]
Host = 127.0.0.1
Port = 50052

[ChatServers]
List = ChatServer1,ChatServer2
[ChatServer1]
Host = 127.0.0.1
Port = 8090
RPCPort = 50053
Name = ChatServer1
[ChatServer2]
Host = 127.0.0.1
Port = 8091
RPCPort = 50054
Name = ChatServer2

[ResourceServer]
Name = ResourceServer
Host = 127.0.0.1
Port = 9090
RPCPort = 51055

[JWT]
Secret = im-seckill-jwt-secret-2026

[Nginx]
Host = 127.0.0.1
Port = 8100
